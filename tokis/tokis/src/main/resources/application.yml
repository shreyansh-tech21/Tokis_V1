spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/tokis
    username: admin
    password: password
    driver-class-name: org.postgresql.Driver
    hikari:
      # Windows JVM zones like "India Standard Time" are invalid for PostgreSQL
      connection-init-sql: SET TIME ZONE 'UTC'

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

server:
  port: 8080